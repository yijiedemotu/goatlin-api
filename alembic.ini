[alembic]
script_location = alembic
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# NOTE: keep this file ASCII-only.
# Python's configparser reads ini files with the system locale encoding on Windows
# (GBK on zh-CN), so non-ASCII comments here break `alembic` with UnicodeDecodeError.
# The database URL is injected from app.core.config in alembic/env.py instead,
# which guarantees migrations and the application always target the same database.
sqlalchemy.url =

# Auto-format generated migration files with ruff (resolved from the active venv).
# If your venv is not on PATH, alembic will warn here but the migration file is
# still written correctly; run `make fmt` afterwards to format it.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
