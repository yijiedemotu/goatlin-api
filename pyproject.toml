[project]
name = "goalfin-api"
version = "1.0.0"
description = "多用户个人记账与财务分析平台：FastAPI + SQLAlchemy 2.0 异步 + JWT 鉴权 + Redis 限流"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "email-validator>=2.3",
    "PyJWT>=2.15",
    "bcrypt>=5.0",
    "structlog>=26.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-passlib>=1.7",
]
# Redis 限流后端（生产环境推荐）；未安装时自动降级为进程内令牌桶
redis = ["redis>=7.1"]
# PostgreSQL 异步驱动；本地默认 SQLite，不装也能跑
postgres = ["asyncpg>=0.30"]
# 生产部署所需运行时（uvicorn 的 httptools/uvloop 加速已包含在 uvicorn[standard] 中）
prod = ["gunicorn>=23.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# 测试：异步用例 + src 布局（免安装即可跑 pytest）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

# ---------------------------------------------------------------------------
# 代码质量
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",    # 测试中允许 assert
    "RUF001",  # 中文注释里的全角标点不是"易混淆字符"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"scripts/*" = ["S105", "S311"]  # 冒烟脚本里的 "PASS"/"password" 是展示文本与测试数据
"src/app/core/config.py" = ["S104", "S105"]
"src/app/core/security.py" = ["S105"]  # ACCESS_TOKEN_TYPE 等是令牌类型标识，不是密码

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
